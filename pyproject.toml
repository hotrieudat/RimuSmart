[project]
name = "RimuSmart"
version = "0.1.0"
description = "RimuSmart API"
authors = [
    { name = "h-dat", email = "trieudat.ho@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
